<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Formulario con CKEditor</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />

    <style>
      body {
        background: #f8f9fa;
      }

      .form-card {
        margin-top: 40px;
        margin-bottom: 40px;
        border: 0;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
      }

      .ck-editor-wrapper .cke {
        width: 100% !important;
      }

      .ck-editor-wrapper .cke_contents {
        min-height: 350px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card form-card">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 mb-4">Formulario con CKEditor</h1>

              <form id="contactoForm" action="#" method="post">
                <div class="form-group">
                  <label for="nombre">Nombre</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="email">Correo electronico</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="nombre@ejemplo.com"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="asunto">Asunto</label>
                  <input
                    type="text"
                    class="form-control"
                    id="asunto"
                    name="asunto"
                    placeholder="Escribe el asunto"
                    required
                  />
                </div>

                <div class="form-group ck-editor-wrapper">
                  <label for="mensaje">Mensaje</label>
                  <textarea
                    class="form-control"
                    id="mensaje"
                    name="mensaje"
                    rows="8"
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                  Enviar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
    <script>
      CKEDITOR.replace("mensaje", {
        width: "100%",
        height: 450,
      });

      document
        .getElementById("contactoForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          alert("Formulario enviado.");
        });
    </script>
  </body>
</html>
